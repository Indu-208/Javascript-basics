<!DOCTYPE html>
<html>
<head>
    <title>Numbers 1 to 10</title>
</head>
<body>
<h2>Numbers from 1 to 10</h2>
<button onclick="showNumbers()">Show Numbers</button>
<p id="result"></p>
<script>
function showNumbers() {
    let numbers = "";
    for (let i = 1; i <= 10; i++) {
        numbers += i + " ";
    }
    document.getElementById("result").innerHTML = numbers;
}
</script>
</body>
</html>
