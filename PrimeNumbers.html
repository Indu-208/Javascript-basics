<!DOCTYPE html>
<html>
<head>
    <title>Prime Numbers</title>
</head>
<body>
<h2>Prime Numbers from 1 to 10</h2>
<button onclick="printPrimes()">Print Primes</button>
<p id="result"></p>
<script>
function printPrimes() {
    let result = "";
    for (let n = 2; n <= 10; n++) {
        let prime = true;
        for (let i = 2; i < n; i++) {
            if (n % i == 0) {
                prime = false;
                break;
            }
        }
        if (prime) {
            result += n + " ";
        }
    }
    document.getElementById("result").innerHTML = result;
}
</script>
</body>
</html>
