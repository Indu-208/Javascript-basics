<!DOCTYPE html>
<html>
    <head>
        <title>datatypes</title>
    </head>
    <body>
        <script>
            let name = "indhu";
            let age = 20;
            let cgpa = 9.0;
            let isStudent = true;
            document.write(typeof name);
            document.write("Name: " + name + "<br>");
            document.write("Age: " + age + "<br>");
            document.write("CGPA: " + cgpa + "<br>");
            document.write("Student: " + isStudent + "<br>");
        </script>
    </body>
</html>
